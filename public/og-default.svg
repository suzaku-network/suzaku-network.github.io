<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="brand-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A4AF"/>
      <stop offset="100%" stop-color="#43F6AB"/>
    </linearGradient>
    <linearGradient id="glow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#00A4AF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#101010" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="#101010"/>
  <!-- Subtle gradient glow at top -->
  <ellipse cx="600" cy="0" rx="600" ry="300" fill="url(#glow)"/>
  <!-- Bottom border accent -->
  <rect x="0" y="618" width="1200" height="12" fill="url(#brand-gradient)"/>
  <!-- Wordmark: SUZAKU -->
  <text
    x="600"
    y="290"
    font-family="Inconsolata, monospace"
    font-size="120"
    font-weight="600"
    text-anchor="middle"
    fill="url(#brand-gradient)"
  >SUZAKU</text>
  <!-- Tagline -->
  <text
    x="600"
    y="370"
    font-family="Inconsolata, monospace"
    font-size="32"
    font-weight="400"
    text-anchor="middle"
    fill="rgba(255,255,255,0.6)"
    letter-spacing="2"
  >Decentralization Hub for Avalanche L1s</text>
  <!-- URL -->
  <text
    x="600"
    y="560"
    font-family="Inconsolata, monospace"
    font-size="22"
    font-weight="400"
    text-anchor="middle"
    fill="rgba(255,255,255,0.3)"
    letter-spacing="1"
  >suzaku.network</text>
</svg>
